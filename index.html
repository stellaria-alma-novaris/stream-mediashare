<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirim Mediashare Stream</title>
    <style>
        body {
            background-color: #09090d;
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .card {
            background: #12121a;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h2 { margin-top: 0; text-align: center; color: #38bdf8; font-size: 20px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: #cbd5e1; }
        input[type="text"], input[type="url"], textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e1e2f;
            color: white;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea { resize: vertical; height: 60px; }
        
        /* Pilihan Reaksi Tombol */
        .reaction-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .reaction-btn {
            background: #1e1e2f;
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 10px 0;
            text-align: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.2s;
        }
        .reaction-btn:hover { background: #2a2a40; }
        .reaction-btn.selected {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
        }

        button.submit-btn {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 15px;
        }
        button.submit-btn:hover { background: #0369a1; }
        #status { text-align: center; margin-top: 12px; font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 Kirim Mediashare</h2>
    <form id="mediaForm">
        <div class="form-group">
            <label for="username">Nama Kamu:</label>
            <input type="text" id="username" required placeholder="Contoh: StreamerID">
        </div>
        
        <div class="form-group">
            <label for="url">Link Media (YouTube, TikTok, Reels, Gambar/GIF):</label>
            <input type="url" id="url" required placeholder="https://...">
        </div>

        <div class="form-group">
            <label for="message">Pesan / Catatan (Opsional):</label>
            <textarea id="message" placeholder="Pesan untuk streamer..."></textarea>
        </div>

        <label>Pilih Reaksi:</label>
        <div class="reaction-grid">
            <div class="reaction-btn selected" data-reaction="senyum" title="Senyum">😊</div>
            <div class="reaction-btn" data-reaction="ketawa" title="Ketawa">😆</div>
            <div class="reaction-btn" data-reaction="nangis" title="Nangis">😢</div>
            <div class="reaction-btn" data-reaction="makan" title="Makan">🍜</div>
        </div>
        <input type="hidden" id="selectedReaction" value="senyum">

        <button type="submit" class="submit-btn" id="submitBtn">Kirim ke Antrian</button>
    </form>
    <div id="status"></div>
</div>

<script>
    // Logika Pemilihan Tombol Reaksi
    const reactionBtns = document.querySelectorAll('.reaction-btn');
    const selectedReactionInput = document.getElementById('selectedReaction');

    reactionBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            reactionBtns.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedReactionInput.value = btn.getAttribute('data-reaction');
        });
    });

    document.getElementById('mediaForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const url = document.getElementById('url').value;
        const message = document.getElementById('message').value;
        const reaction = document.getElementById('selectedReaction').value;
        
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');

        submitBtn.disabled = true;
        statusDiv.style.color = '#fde047';
        statusDiv.textContent = 'Mengirim data...';

        try {
            // Ubah URL di bawah ini dengan URL publik server Node.js kamu (misal: Ngrok URL atau server hosting)
            const backendUrl = 'https://URL-NGROK-KAMU.ngrok-free.app/api/mediashare';

            const response = await fetch(backendUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, url, message, reaction })
            });

            const result = await response.json();

            if (response.ok) {
                statusDiv.style.color = '#22c55e';
                statusDiv.textContent = 'Berhasil! Link masuk antrian.';
                document.getElementById('mediaForm').reset();
                // Reset pilihan reaksi ke default
                reactionBtns.forEach(b => b.classList.remove('selected'));
                reactionBtns[0].classList.add('selected');
                selectedReactionInput.value = 'senyum';
            } else {
                statusDiv.style.color = '#f43f5e';
                statusDiv.textContent = result.error || 'Gagal mengirim link.';
            }
        } catch (error) {
            statusDiv.style.color = '#f43f5e';
            statusDiv.textContent = 'Gagal terhubung ke server (Cek Ngrok/Koneksi).';
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
