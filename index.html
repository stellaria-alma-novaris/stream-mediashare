<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0e18">
<title>Mediashare — SΛN_CH</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0a0e18;
  --panel:#111826;
  --line:#243049;
  --text:#eef3fa;
  --muted:#8b96ae;
  --accent:#48c5ff;
  --accent-ink:#062536;
  --ok:#8fd4a0;
  --bad:#e9808a;
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0;
  min-height:100vh;
  padding:16px 14px;
  background:
    radial-gradient(900px 480px at 50% -12%, #16243d 0%, var(--bg) 55%)
    var(--bg);
  color:var(--text);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
  transition:background .3s,color .3s;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
body::after{
  content:"";
  position:fixed;left:0;right:0;bottom:0;height:160px;
  background:linear-gradient(to top, rgba(255,255,255,.07), rgba(255,255,255,0));
  pointer-events:none;
}
main{width:100%;max-width:400px;position:relative;z-index:1}

.ticket{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  transition:background .3s,border-color .3s;
}
.ticket-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:16px 18px 2px;
}
h1{font-size:1.3rem;font-weight:800;margin:0;letter-spacing:-.01em}
.chan{font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap;text-decoration:none;transition:border-color .15s,color .15s}
.chan:hover,.chan:focus-visible{color:var(--accent);border-color:var(--accent)}

.perf{position:relative;height:0;border-top:1px dashed var(--line);margin:14px 0 0}
.perf::before,.perf::after{content:"";position:absolute;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--bg);transition:background .3s}
.perf::before{left:-7px}
.perf::after{right:-7px}

form{padding:16px 18px 14px;display:flex;flex-direction:column;gap:10px}

.field label{display:block;font-size:.78rem;font-weight:650;color:var(--muted);margin:0 0 4px}
input,textarea{
  width:100%;background:#0e0c13;border:1px solid var(--line);border-radius:9px;
  padding:10px 11px;color:var(--text);font:inherit;outline:none;
}
input::placeholder,textarea::placeholder{color:#635c72}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:50px}

.url-row{display:flex;gap:7px}
.url-row input{min-width:0;flex:1}
#mediaUrl.url-ok{border-color:var(--ok);box-shadow:0 0 0 3px #8fd4a01f}
#mediaUrl.url-bad{border-color:var(--bad);box-shadow:0 0 0 3px #e9808a1f}

button{font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--text)}
button:focus-visible,input:focus-visible,textarea:focus-visible,.reaction:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#checkBtn{padding:0 12px;white-space:nowrap;color:var(--accent);border-color:#1f425c}
#checkBtn:disabled{opacity:.5;cursor:wait}

details.hint{font-size:.78rem;color:var(--muted)}
details.hint summary{cursor:pointer}
details.hint p{margin:5px 0 0}

.reactions{display:flex;gap:6px}
.reaction{flex:1;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;background:#0e0c13}
.reaction span{font-size:1.25rem;line-height:1}
.reaction small{font-size:.66rem;color:var(--muted)}
.reaction[aria-pressed="true"]{border-color:var(--accent);background:#2a2114}
.reaction[aria-pressed="true"] small{color:var(--text)}

.agree{display:flex;align-items:flex-start;gap:8px;font-size:.78rem;color:var(--muted);cursor:pointer;margin-top:2px}
.agree input{width:16px;height:16px;flex:none;margin-top:1px;accent-color:var(--accent)}

#sendBtn{
  width:100%;padding:11px;font-size:.95rem;border:none;
  background:var(--accent);color:var(--accent-ink);
}
#sendBtn:disabled{opacity:.55;cursor:wait}
.hidden{display:none!important}

#feedback{margin-top:2px;border-radius:9px;padding:9px 11px;display:none;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.82rem}
#feedback.info{display:block;background:#1e2230;color:#c9d3f5}
#feedback.ok{display:block;background:#15271c;color:var(--ok)}
#feedback.bad{display:block;background:#2c171a;color:var(--bad)}

.thanks{padding:22px 18px 24px;text-align:center}
.thanks-emoji{font-size:2.6rem;line-height:1}
.thanks-title{font-size:1.1rem;font-weight:800;margin:8px 0 2px}
.thanks-msg{font-size:.86rem;color:var(--muted);margin:0 0 16px;line-height:1.5}
#againBtn{padding:9px 16px;font-size:.84rem;border-color:var(--line);color:var(--muted)}

footer{text-align:center;color:var(--muted);font-size:.72rem;margin:12px 0 0;line-height:1.5;opacity:.75}

/* reaction pastel themes, applied to <body> after a successful send */
body.theme-senyum{--bg:#eaf2ff;--panel:#ffffff;--text:#223047;--muted:#5b6b85;--accent:#6f9adf;--accent-ink:#0c1c33;--line:#d7e4fa;}
body.theme-ketawa{--bg:#f3ecff;--panel:#ffffff;--text:#2c2440;--muted:#6b5f88;--accent:#a789e0;--accent-ink:#1c1430;--line:#e3d7fa;}
body.theme-nangis{--bg:#fff0f5;--panel:#ffffff;--text:#4a2733;--muted:#8a5d6c;--accent:#e18fab;--accent-ink:#3a1420;--line:#f7dbe6;}
body.theme-makan{--bg:#eefaf0;--panel:#ffffff;--text:#223a28;--muted:#5c7c64;--accent:#6fbf86;--accent-ink:#0f2414;--line:#d7f0dd;}

@media(max-width:360px){
  .reaction small{display:none}
}
</style>
</head>
<body>
<main>
<div class="ticket" id="ticket">
  <div class="ticket-head">
    <h1>Mediashare</h1>
    <a class="chan" href="https://youtube.com/@san_ch5" target="_blank" rel="noopener noreferrer">SΛN_CH</a>
  </div>
  <div class="perf" aria-hidden="true"></div>

  <form id="mediashareForm">
    <div style="position:absolute; left:-9999px;" aria-hidden="true">
        <label for="website">Website</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
    </div>

    <div class="field">
      <label for="username">Nama viewer</label>
      <input id="username" name="username" maxlength="30" autocomplete="nickname" placeholder="Nama kamu" required>
    </div>

    <div class="field">
      <label for="mediaUrl">Link video / gambar</label>
      <div class="url-row">
        <input id="mediaUrl" name="url" type="url" maxlength="2048" placeholder="youtube.com / tiktok.com / ..." autocomplete="url" required>
        <button id="checkBtn" type="button">Cek</button>
      </div>
      <details class="hint"><summary>Platform yang didukung</summary><p>YouTube, TikTok, IG Reels, GIF/JPG/PNG, Giphy, Tenor, Streamable, Vimeo, dan sejenisnya.</p></details>
    </div>

    <div class="field">
      <label for="message">Pesan (opsional)</label>
      <textarea id="message" name="message" maxlength="360" placeholder="Pesan kesan dan sarannya..."></textarea>
    </div>

    <div class="field">
      <label>Reaksi (opsional)</label>
      <div class="reactions" role="group" aria-label="Reaksi">
        <button class="reaction" type="button" data-reaction="senyum" aria-pressed="false"><span>😊</span><small>Senyum</small></button>
        <button class="reaction" type="button" data-reaction="ketawa" aria-pressed="false"><span>😂</span><small>Ketawa</small></button>
        <button class="reaction" type="button" data-reaction="nangis" aria-pressed="false"><span>😭</span><small>Nangis</small></button>
        <button class="reaction" type="button" data-reaction="makan" aria-pressed="false"><span>🍜</span><small>Makan</small></button>
      </div>
    </div>

    <label class="agree">
      <input type="checkbox" id="agree">
      <span>Saya setuju link &amp; pesan ini ditampilkan saat live, sesuai moderasi.</span>
    </label>

    <button id="sendBtn" type="submit" class="hidden">Kirim mediashare</button>
    <div id="feedback" role="status" aria-live="polite"></div>
  </form>

  <div class="thanks hidden" id="thanksView">
    <div class="thanks-emoji" id="thanksEmoji">😊</div>
    <p class="thanks-title" id="thanksTitle">Terkirim!</p>
    <p class="thanks-msg" id="thanksMsg">Makasih udah mampir. Sampai ketemu di live berikutnya ✨</p>
    <button type="button" id="againBtn">Kirim lagi</button>
  </div>
</div>
<footer>Dengan mengirim, kamu menyetujui link dan pesan ditampilkan sesuai moderasi livestream.</footer>
</main>

<!-- Ganti dua nilai di bawah dengan Project URL dan anon/publishable key Supabase.
     Jangan pernah menaruh service_role key di GitHub Pages. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  "use strict";

  const SUPABASE_URL = "https://kurqeeguaqypxkllocex.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1cnFlZWd1YXF5cHhrbGxvY2V4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3Njg1MjcsImV4cCI6MjEwNzM0NDUyN30.mR3FwgVEVRLLb9B-v-5wKMbYZ03jCB6hoMpdgozaYvc";
  const TABLE = "mediashare";

  const ticket = document.getElementById("ticket");
  const form = document.getElementById("mediashareForm");
  const username = document.getElementById("username");
  const urlInput = document.getElementById("mediaUrl");
  const message = document.getElementById("message");
  const checkBtn = document.getElementById("checkBtn");
  const sendBtn = document.getElementById("sendBtn");
  const feedback = document.getElementById("feedback");
  const agree = document.getElementById("agree");
  const reactionButtons = [...document.querySelectorAll("[data-reaction]")];
  const thanksView = document.getElementById("thanksView");
  const thanksEmoji = document.getElementById("thanksEmoji");
  const thanksTitle = document.getElementById("thanksTitle");
  const thanksMsg = document.getElementById("thanksMsg");
  const againBtn = document.getElementById("againBtn");

  const REACTION_META = {
    senyum: { emoji: "😊", theme: "theme-senyum", note: "Makasih udah mampir." },
    ketawa: { emoji: "😂", theme: "theme-ketawa", note: "Makasih, semoga beneran lucu ya." },
    nangis: { emoji: "😭", theme: "theme-nangis", note: "Makasih udah berbagi, peluk dulu." },
    makan:  { emoji: "🍜", theme: "theme-makan",  note: "Makasih, jangan lupa makan juga." }
  };
  const ALL_THEMES = Object.values(REACTION_META).map(m => m.theme);

  let selectedReaction = null;
  let checkedUrl = "";

  function showFeedback(text, kind = "info") {
    feedback.textContent = text;
    feedback.className = kind;
  }

  function parseAndRecognizeUrl(value) {
    let parsed;
    try { parsed = new URL(value.trim()); }
    catch { return { ok: false, reason: "Format URL belum benar. Masukkan link lengkap yang diawali https:// atau http://." }; }

    if (!["https:", "http:"].includes(parsed.protocol)) {
      return { ok: false, reason: "Link harus memakai HTTP atau HTTPS." };
    }
    if (!parsed.hostname || !parsed.hostname.includes(".")) {
      return { ok: false, reason: "Nama domain link tidak valid." };
    }

    const host = parsed.hostname.toLowerCase().replace(/^www\./, "");
    const imageExt = /\.(gif|jpe?g|png|webp|bmp|avif)$/i.test(parsed.pathname);
    const known = [
      "youtube.com", "youtu.be", "youtube-nocookie.com",
      "tiktok.com", "instagram.com",
      "giphy.com", "giphy.com", "tenor.com",
      "imgur.com", "i.imgur.com", "streamable.com",
      "vimeo.com", "reddit.com", "redd.it",
      "x.com", "twitter.com", "facebook.com", "fb.watch",
      "drive.google.com", "dropbox.com", "medal.tv",
      "clips.twitch.tv", "twitch.tv"
    ];
    const supported = imageExt || known.some(d => host === d || host.endsWith("." + d));
    return {
      ok: true,
      url: parsed.href,
      supported,
      imageExt,
      host
    };
  }

  function clearUrlStatus() {
    urlInput.classList.remove("url-ok", "url-bad");
  }

  function runCheck() {
    const result = parseAndRecognizeUrl(urlInput.value);
    checkedUrl = "";
    clearUrlStatus();
    if (!result.ok) {
      urlInput.classList.add("url-bad");
      updateSendVisibility();
      return result;
    }
    checkedUrl = result.url;
    if (result.imageExt || result.supported) {
      urlInput.classList.add("url-ok");
    } else {
      urlInput.classList.add("url-bad");
    }
    updateSendVisibility();
    return result;
  }

  function updateSendVisibility() {
    const ready = username.value.trim() !== "" &&
      checkedUrl !== "" && urlInput.value.trim() === checkedUrl &&
      agree.checked;
    sendBtn.classList.toggle("hidden", !ready);
  }

  checkBtn.addEventListener("click", runCheck);

  username.addEventListener("input", updateSendVisibility);

  urlInput.addEventListener("input", () => {
    if (checkedUrl && urlInput.value.trim() !== checkedUrl) {
      checkedUrl = "";
      clearUrlStatus();
    }
    updateSendVisibility();
  });

  reactionButtons.forEach(button => {
    button.addEventListener("click", () => {
      const next = button.dataset.reaction;
      selectedReaction = selectedReaction === next ? null : next;
      reactionButtons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.reaction === selectedReaction)));
    });
  });

  agree.addEventListener("change", () => {
    if (agree.checked && (!checkedUrl || urlInput.value.trim() !== checkedUrl)) {
      runCheck();
    }
    updateSendVisibility();
  });

  function setTheme(name) {
    document.body.classList.remove(...ALL_THEMES);
    if (name) document.body.classList.add(name);
  }

  function showThanks() {
    const meta = REACTION_META[selectedReaction] || REACTION_META.senyum;
    thanksEmoji.textContent = meta.emoji;
    thanksTitle.textContent = "Terkirim!";
    thanksMsg.textContent = meta.note + " Sampai ketemu di live berikutnya ✨";
    setTheme(meta.theme);
    form.classList.add("hidden");
    thanksView.classList.remove("hidden");
  }

  function backToForm() {
    thanksView.classList.add("hidden");
    form.classList.remove("hidden");
    setTheme(null);
  }

  againBtn.addEventListener("click", backToForm);

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const lastSubmit = localStorage.getItem("mediashare_last_submit");
    const cooldownMs = 60 * 1000; // 1 menit
    if (lastSubmit && (Date.now() - lastSubmit < cooldownMs)) {
      const sisaDetik = Math.ceil((cooldownMs - (Date.now() - lastSubmit)) / 1000);
      showFeedback(`⏳ Tunggu ${sisaDetik} detik lagi sebelum mengirim.`, "bad");
      return;
    }

    if (document.getElementById("website").value !== "") {
      showFeedback("❌ Pengiriman ditolak.", "bad");
      return; // Anggap sebagai spam
    }

    if (!agree.checked) {
      showFeedback("Centang dulu persetujuannya sebelum mengirim.", "info");
      return;
    }

    if (!form.reportValidity()) return;

    const result = parseAndRecognizeUrl(urlInput.value);
    if (!result.ok) {
      showFeedback("❌ " + result.reason, "bad");
      return;
    }
    if (checkedUrl !== result.url) {
      showFeedback("Periksa link dulu dengan tombol Cek sebelum mengirim.", "info");
      return;
    }

    if (SUPABASE_URL.includes("YOUR_PROJECT_REF") || SUPABASE_ANON_KEY.includes("YOUR_SUPABASE")) {
      showFeedback("Supabase belum dikonfigurasi. Isi SUPABASE_URL dan SUPABASE_ANON_KEY di index.html.", "bad");
      return;
    }
    if (!window.supabase?.createClient) {
      showFeedback("Library Supabase gagal dimuat. Periksa koneksi internet lalu coba lagi.", "bad");
      return;
    }

    sendBtn.disabled = true;
    checkBtn.disabled = true;
    showFeedback("Mengirim mediashare…", "info");
    try {
      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const payload = {
        username: username.value.trim(),
        url: result.url,
        message: message.value.trim(),
        reaction: selectedReaction
      };
      const { error } = await client.from(TABLE).insert(payload);
      if (error) throw error;

      localStorage.setItem("mediashare_last_submit", Date.now());
      showThanks();

      form.reset();
      selectedReaction = null;
      checkedUrl = "";
      clearUrlStatus();
      reactionButtons.forEach(b => b.setAttribute("aria-pressed", "false"));
      updateSendVisibility();
      showFeedback("", "info");
      feedback.className = "";
    } catch (err) {
      console.error("[MEDIASHARE]", err);
      showFeedback("❌ Gagal mengirim. " + (err?.message || "Periksa konfigurasi Supabase dan kebijakan RLS."), "bad");
    } finally {
      sendBtn.disabled = false;
      checkBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
