<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirim Link Mediashare</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h2 { margin-top: 0; text-align: center; color: #38bdf8; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0369a1; }
        #status { text-align: center; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Mediashare Stream</h2>
    <form id="mediaForm">
        <div class="form-group">
            <label for="username">Nama Kamu:</label>
            <input type="text" id="username" required placeholder="Contoh: Budi">
        </div>
        <div class="form-group">
            <label for="url">Link YouTube:</label>
            <input type="url" id="url" required placeholder="https://youtu.be/...">
        </div>
        <button type="submit" id="submitBtn">Kirim ke Antrian</button>
    </form>
    <div id="status"></div>
</div>

<script>
    document.getElementById('mediaForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const url = document.getElementById('url').value;
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');

        submitBtn.disabled = true;
        statusDiv.style.color = '#fde047';
        statusDiv.textContent = 'Mengirim...';

        try {
            // GANTI URL DI BAWAH INI DENGAN URL BACKEND NODE.JS KAMU NANTI
            const backendUrl = 'https://backend-nodejs-kamu.onrender.com/api/submit';

            const response = await fetch(backendUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, url })
            });

            const result = await response.json();

            if (response.ok) {
                statusDiv.style.color = '#22c55e';
                statusDiv.textContent = 'Berhasil masuk antrian!';
                document.getElementById('mediaForm').reset();
            } else {
                statusDiv.style.color = '#f43f5e';
                statusDiv.textContent = result.message || 'Gagal mengirim link.';
            }
        } catch (error) {
            statusDiv.style.color = '#f43f5e';
            statusDiv.textContent = 'Gagal terhubung ke server.';
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
